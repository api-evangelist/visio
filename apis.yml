aid: visio
name: Microsoft Visio API
description: >-
  Microsoft Visio provides APIs for creating, editing, and managing Visio diagrams and drawings. The Visio JavaScript
  API enables developers to build Office Add-ins that interact with Visio diagrams embedded in SharePoint Online pages,
  accessing document elements such as pages, shapes, hyperlinks, comments, and shape data. Visio APIs support
  programmatic diagram manipulation, visual overlay creation, mouse event handling, and data visualization workflows.
