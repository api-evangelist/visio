naftiko: 1.0.0-alpha2
info:
  label: Visio JavaScript API — Application
  description: 'Visio JavaScript API — Application. 2 operations. Lead operation: Get Application. Self-contained Naftiko
    capability covering one Visio business surface.'
  tags:
  - Visio
  - Application
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISIO_API_KEY: VISIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-application
    baseUri: https://appsforoffice.microsoft.com/embedded/1.0
    description: Visio JavaScript API — Application business capability. Self-contained, no shared references.
    resources:
    - name: document-application
      path: /document/application
      operations:
      - name: getapplication
        method: GET
        description: Get Application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapplication
        method: PATCH
        description: Update Application Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Embedded-Session
      value: '{{env.VISIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: javascript-application-rest
    port: 8080
    description: REST adapter for Visio JavaScript API — Application. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/document/application
      name: document-application
      description: REST surface for document-application.
      operations:
      - method: GET
        name: getapplication
        description: Get Application
        call: javascript-application.getapplication
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateapplication
        description: Update Application Settings
        call: javascript-application.updateapplication
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-application-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visio JavaScript API — Application. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-application
      description: Get Application
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-application.getapplication
      outputParameters:
      - type: object
        mapping: $.
    - name: update-application-settings
      description: Update Application Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: javascript-application.updateapplication
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
