naftiko: 1.0.0-alpha2
info:
  label: Visio JavaScript API — Pages
  description: 'Visio JavaScript API — Pages. 4 operations. Lead operation: Get Active Page. Self-contained Naftiko capability
    covering one Visio business surface.'
  tags:
  - Visio
  - Pages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISIO_API_KEY: VISIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-pages
    baseUri: https://appsforoffice.microsoft.com/embedded/1.0
    description: Visio JavaScript API — Pages business capability. Self-contained, no shared references.
    resources:
    - name: document-getActivePage
      path: /document/getActivePage
      operations:
      - name: getactivepage
        method: GET
        description: Get Active Page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: document-pages
      path: /document/pages
      operations:
      - name: listpages
        method: GET
        description: List Pages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: document-pages-pageName
      path: /document/pages/{pageName}
      operations:
      - name: getpage
        method: GET
        description: Get Page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageName
          in: path
          type: string
          description: Name of the Visio page to retrieve
          required: true
    - name: document-pages-pageName-view
      path: /document/pages/{pageName}/view
      operations:
      - name: updatepageview
        method: PATCH
        description: Update Page View
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageName
          in: path
          type: string
          description: Name of the Visio page
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Embedded-Session
      value: '{{env.VISIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: javascript-pages-rest
    port: 8080
    description: REST adapter for Visio JavaScript API — Pages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/document/getactivepage
      name: document-getactivepage
      description: REST surface for document-getActivePage.
      operations:
      - method: GET
        name: getactivepage
        description: Get Active Page
        call: javascript-pages.getactivepage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/document/pages
      name: document-pages
      description: REST surface for document-pages.
      operations:
      - method: GET
        name: listpages
        description: List Pages
        call: javascript-pages.listpages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/document/pages/{pagename}
      name: document-pages-pagename
      description: REST surface for document-pages-pageName.
      operations:
      - method: GET
        name: getpage
        description: Get Page
        call: javascript-pages.getpage
        with:
          pageName: rest.pageName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/document/pages/{pagename}/view
      name: document-pages-pagename-view
      description: REST surface for document-pages-pageName-view.
      operations:
      - method: PATCH
        name: updatepageview
        description: Update Page View
        call: javascript-pages.updatepageview
        with:
          pageName: rest.pageName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-pages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Visio JavaScript API — Pages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-active-page
      description: Get Active Page
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-pages.getactivepage
      outputParameters:
      - type: object
        mapping: $.
    - name: list-pages
      description: List Pages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-pages.listpages
      outputParameters:
      - type: object
        mapping: $.
    - name: get-page
      description: Get Page
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-pages.getpage
      with:
        pageName: tools.pageName
      outputParameters:
      - type: object
        mapping: $.
    - name: update-page-view
      description: Update Page View
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: javascript-pages.updatepageview
      with:
        pageName: tools.pageName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
